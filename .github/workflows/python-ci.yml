name: CI Test and Build Push Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🔎 Run Pytest
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Run tests
        run: pytest tests/

  docker-build:
    name: 🐳 Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 🔴 ОБЯЗАТЕЛЬНО для доступа к git tag!

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: 🏷️ Determine image version
        id: version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag: $latest_tag"
          version_parts=(${latest_tag//./ })
          major=${version_parts[0]#v}
          minor=${version_parts[1]}
          patch=${version_parts[2]}
          new_patch=$((patch + 1))
          new_version="v$major.$minor.$new_patch"
          echo "version=$new_version" >> $GITHUB_OUTPUT

      - name: 🔨 Build and Push
        run: |
          docker build -t rizvashi/bulls_web:latest -t rizvashi/bulls_web:${{ steps.version.outputs.version }} .
          docker push rizvashi/bulls_web:latest
          docker push rizvashi/bulls_web:${{ steps.version.outputs.version }}




